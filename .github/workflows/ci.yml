# AttendAI: test every change, then (main branch only) update the college PC.
#
#  push / pull request  ->  backend tests (PostgreSQL) + frontend tests + build
#  push to main         ->  after both pass, the college PC (self-hosted runner,
#                           label "attendai") copies the code in and restarts.
#
# Keep this repository PRIVATE: a self-hosted runner runs code from the repo on
# the college PC. See deploy/README-DEPLOY.md, part E.
name: AttendAI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: attendai-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: attendai
          POSTGRES_PASSWORD: attendai
          POSTGRES_DB: attendai_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U attendai"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg2://attendai:attendai@localhost:5432/attendai_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: System libraries for OpenCV
        run: sudo apt-get update -q && sudo apt-get install -y -q libgl1 libglib2.0-0
      - name: Install packages
        run: |
          pip install -r requirements.txt
          pip install face_recognition --no-deps
          pip install pytest pyflakes
      - name: Check for mistakes (pyflakes)
        run: python -m pyflakes *.py tests/*.py
      - name: Run tests
        run: python -m pytest -q -p no:warnings

  frontend:
    name: Frontend tests + build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx vitest run
      - run: npm run build

  deploy:
    name: Update the college PC
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Windows, attendai]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Copy in, build, restart
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File deploy\windows\update.ps1 -Source "$env:GITHUB_WORKSPACE"
